# What we believe about models — the facts no endpoint will tell us.
# Merge precedence: deployments entry > observed (probe) > models entry > catalog.
# Disagreements between belief and observation are reported, not silently
# resolved; record where a fact came from as a dated comment.
models:
  qwen2.5-14b:
    match: ["qwen2.5:14b", "Qwen/Qwen2.5-14B*"]
    context: 131072       # native; ollama serves it at 32768, so expect a reported conflict
    tools: true
  qwen2.5-7b:
    match: ["qwen2.5:7b", "Qwen/Qwen2.5-7B*"]
    tools: true
  codestral-22b:
    match: ["codestral:*"]
    context: 32768
    tools: false          # code/FIM model; no tool template on ollama
  llava:
    match: ["llava:*"]
    vision: true
    tools: false
  llava-34b:
    # The 34B is a different model, not a size of the same one: longest-match
    # wins, so this entry claims llava:34b and `llava` keeps the rest.
    match: ["llava:34b"]
    vision: true
    tools: false
  deepseek-r1-14b:
    match: ["deepseek-r1:14b"]
    tools: false          # r1 distill chat template has no tool support
  deepseek-r1-32b:
    match: ["deepseek-r1:32b"]
    tools: false
  deepseek-r1-70b:
    match: ["deepseek-r1:70b"]
    tools: false
  llama3.3-70b:
    match: ["llama3.3*"]
  llama3.2:
    match: ["llama3.2*"]
  mxbai-embed-large:
    match: ["mxbai-embed-large*"]
    mode: embedding
  gemini-2.5-pro:
    match: ["gemini-2.5-pro*"]
    catalog_key: gemini/gemini-2.5-pro
  gemini-2.5-flash:
    match: ["gemini-2.5-flash*"]
    catalog_key: gemini/gemini-2.5-flash
  nova-lite:
    match: ["*amazon.nova-lite*"]
  claude-haiku-4-5:
    # No catalog_key: the served id IS the catalog key, and the us.… entry
    # carries the Bedrock cross-region price, not the first-party API price.
    match: ["*anthropic.claude-haiku-4-5*", "claude-haiku-4-5*"]
  claude-sonnet-4-6:
    match: ["*anthropic.claude-sonnet-4-6*", "claude-sonnet-4-6*"]
  claude-opus-5:
    match: ["claude-opus-5*", "*anthropic.claude-opus-5*"]
    catalog_key: claude-opus-5
  claude-sonnet-5:
    match: ["claude-sonnet-5*", "*anthropic.claude-sonnet-5*"]
    catalog_key: claude-sonnet-5

# Price is a deployment fact, not a model fact: the nominal $1/Mtok below makes
# logged cost read directly as millions of tokens on THIS box. A work vLLM
# serving the same model must not inherit it and undercut the real catalog.
deployments:
  home-ollama:
    "codestral:22b-v0.1-q4_0":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "qwen2.5:14b":
      max_output: 4096    # example deployment override: we cap generation on this box
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "qwen2.5:7b":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "mxbai-embed-large:latest":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "llava:latest":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "llava:34b":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "deepseek-r1:14b":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "deepseek-r1:32b":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "deepseek-r1:70b":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "llama3.3:latest":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
    "llama3.2:latest":
      input_per_mtok: 1.0
      output_per_mtok: 1.0
