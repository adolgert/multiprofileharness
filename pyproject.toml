[project]
name = "multiagent"
version = "0.1.0"
description = "Start AI agents against the right backends with the right money"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
ma = "multiagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiagent"]

[dependency-groups]
dev = ["pytest>=8"]
